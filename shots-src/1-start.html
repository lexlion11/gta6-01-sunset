<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunset City - the title card over the bay</title>
<style>
  html, body { margin: 0; padding: 0; background: #14161f; overflow: hidden; }
  /* The canvas is 1280x800 and the page is exactly that big, so a capture of the
     page's viewport is the game's own frame with nothing cropped and nothing added. */
  #game { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; display: block; }
  /* The page itself is never captured, but it is kept dark so a stray border
     around the canvas cannot show up in the picture. */
  body { background: #14161f; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module" src="../game/src/main.js"></script>
</body>
</html>
